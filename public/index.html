<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Email Sender</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>📧 Simple Email Sender</h1>

        <p class="subtitle">
            Enter the recipient's email address and click the button below to send a beautifully designed HTML email.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Enter recipient email address">

        <button onclick="sendEmail()">

            Send Email

        </button>

        <p id="message"></p>

    </div>

    <script src="app.js"></script>

</body>

</html>
